name: Deploy bump (reusable)

# After a release, rewrites the image tag in the Kubernetes manifests of the caller and commits
# the change onto the branch as the GitHub App, in two jobs so that the job that rewrites files
# never sees a secret (see docs/modules/sync.md). The caller keeps the triggers and the release
# chain (see templates/deploy-bump.yml); everything below runs with the CALLER's context.
#
# bump:   checks out the branch, rewrites `<image>:<tag>` to `<image>:<version>` in the tracked
#         YAML files under the given paths and uploads the files that changed, and nothing else,
#         as an artifact. It holds NO secret.
# commit: holds the secrets, never runs the caller's code. It downloads the artifact, treats it
#         as untrusted (plain paths inside the policy's `paths` only), compares every file with
#         the head of the branch and commits the ones that differ with the commit verb: a
#         GraphQL createCommitOnBranch commit, signed by GitHub, with contents:write only.
on:
  workflow_call:
    inputs:
      version:
        description: The released version the image tags are set to (letters, digits and . _ -).
        type: string
        required: true
      images:
        description: >-
          Extended regular expression of the image repositories without tag, for example
          ghcr\.io/lukislp/(studylife-ai).
        type: string
        required: true
      paths:
        description: Space-separated directories to scan for manifests.
        type: string
        default: k8s deploy
      exclude:
        description: grep -E pattern of manifest paths to leave alone.
        type: string
        default: /flux/
      branch:
        description: The branch to rewrite and to commit onto. Must equal the branch in the policy.
        type: string
        default: main
      handover-artifact:
        description: >-
          Optional name of an artifact uploaded earlier in the caller's run, laid out as a handover
          directory (manifest.txt plus files/<path>, see sync.yml). Its files are committed together
          with the tag bump, in the same commit; the policy's paths must cover them.
        type: string
        default: ''
      bot-repository:
        description: The repository this reusable workflow lives in. Change only in a fork.
        type: string
        default: lukislp/lktec-bot
    secrets:
      app-id:
        description: The GitHub App id (a secret named LKTEC_BOT_APP_ID in the caller).
        required: true
      private-key:
        description: The App's private key in PEM form (a secret named LKTEC_BOT_PRIVATE_KEY).
        required: true
    outputs:
      decision:
        description: >-
          committed, unchanged, skipped (the branch moved on and changed a manifest since the
          checkout; the next run starts over), denied or error.
        value: ${{ jobs.commit.outputs.decision || 'unchanged' }}
      url:
        description: The commit URL, when a commit was made.
        value: ${{ jobs.commit.outputs.url }}

permissions:
  contents: read
  actions: read # to read which commit of this workflow the run uses

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No secret is referenced anywhere in this job, and its token can read the repository only.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.extra.outputs.changed || steps.collect.outputs.changed }}
      base: ${{ steps.checkout.outputs.base }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # Checkout talks to GitHub; the artifact upload and download to the results receiver and
          # blob storage.
          allowed-endpoints: >
            *.blob.core.windows.net:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      # The commit the manifests are rewritten from; the commit job skips the run when the
      # branch changed one of them since.
      - id: checkout
        name: Record the checked-out commit
        run: echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: collect
        name: Set the image tags and collect the changed manifests
        env:
          VERSION: ${{ inputs.version }}
          IMAGES: ${{ inputs.images }}
          SCAN_PATHS: ${{ inputs.paths }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          set -eu
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9A-Za-z._-]+$'; then
            echo "::error::the version has characters outside letters, digits and . _ -"
            exit 1
          fi
          # The expression ends up in a sed command delimited by '#'.
          case "$IMAGES" in
            '' | *'#'* | *$'\n'*)
              echo "::error::images must be a single-line expression without '#'"
              exit 1
              ;;
          esac
          handover="$RUNNER_TEMP/handover"
          mkdir -p "$handover/files"
          : > "$handover/manifest.txt"
          changed=false
          # Word splitting is the point here: one pathspec per directory.
          # shellcheck disable=SC2086
          while IFS= read -r -d '' path; do
            case "$path" in
              *.yaml | *.yml) ;;
              *) continue ;;
            esac
            if [ -n "$EXCLUDE" ] && printf '%s' "$path" | grep -Eq -- "$EXCLUDE"; then
              continue
            fi
            if ! grep -Eq -- "(${IMAGES}):[0-9A-Za-z._-]+" "$path"; then
              continue
            fi
            sed -i -E "s#(${IMAGES}):[0-9A-Za-z._-]+#\1:${VERSION}#g" "$path"
            if git diff --quiet -- "$path"; then
              continue
            fi
            if ! printf '%s' "$path" | grep -Eq '^[A-Za-z0-9._/@+ -]+$'; then
              echo "::warning::not handing over $path: the path has characters the bot does not accept"
              continue
            fi
            mkdir -p "$handover/files/$(dirname "$path")"
            cp "$path" "$handover/files/$path"
            printf '%s\n' "$path" >> "$handover/manifest.txt"
            echo "changed: $path"
            changed=true
          done < <(git ls-files -z -- $SCAN_PATHS)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" != true ]; then
            echo "no manifest sets a different tag for these images"
          fi
      - if: inputs.handover-artifact != ''
        name: Download the extra handover
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.handover-artifact }}
          path: ${{ runner.temp }}/extra
      # The extra files come from a job of the caller; they are untrusted like the artifact the
      # commit job downloads, and the sync module checks them again against the policy.
      - id: extra
        if: inputs.handover-artifact != ''
        name: Merge the extra handover into the handover
        env:
          CHANGED: ${{ steps.collect.outputs.changed }}
        run: |
          set -eu
          extra="$RUNNER_TEMP/extra"
          handover="$RUNNER_TEMP/handover"
          changed="$CHANGED"
          if [ ! -f "$extra/manifest.txt" ]; then
            echo "::error::the artifact has no manifest.txt"
            exit 1
          fi
          while IFS= read -r path || [ -n "$path" ]; do
            [ -n "$path" ] || continue
            if ! printf '%s' "$path" | grep -Eq '^[A-Za-z0-9._/@+ -]+$'; then
              echo "::warning::not handing over $path: the path has characters the bot does not accept"
              continue
            fi
            if [ -L "$extra/files/$path" ] || [ ! -f "$extra/files/$path" ]; then
              echo "::warning::not handing over $path: no such regular file under files/"
              continue
            fi
            mkdir -p "$handover/files/$(dirname "$path")"
            cp "$extra/files/$path" "$handover/files/$path"
            if ! grep -Fxq -- "$path" "$handover/manifest.txt"; then
              printf '%s\n' "$path" >> "$handover/manifest.txt"
            fi
            echo "extra: $path"
            changed=true
          done < "$extra/manifest.txt"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - if: steps.extra.outputs.changed == 'true' || steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-bump-handover
          path: ${{ runner.temp }}/handover
          # A manifest may live below a dot directory.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      decision: ${{ steps.commit.outputs.decision }}
      url: ${{ steps.commit.outputs.url }}
    # One commit at a time per branch; a second run waits for the first.
    concurrency:
      group: sync-commit-${{ github.repository }}-${{ inputs.branch }}
      cancel-in-progress: false
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # uv talks to PyPI only; the bot to api.github.com; setup-uv reads its version manifest
          # from raw.githubusercontent.com and downloads uv from the GitHub release; the
          # artifact download comes from the results receiver and blob storage.
          allowed-endpoints: >
            *.blob.core.windows.net:443
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
      # The bot, at the commit this workflow file was called at. NOT the caller's code: this job
      # holds the App secrets. A reusable workflow cannot read its own repository or commit
      # from the github context, but the run lists the workflows it references with their
      # commit.
      - name: Find the commit this workflow was called at
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_REPOSITORY: ${{ inputs.bot-repository }}
        run: |
          # Only an entry of the bot's own repository counts: a caller that also references the
          # deploy-bump.yml of another repository must not make this job run that code.
          entry="$(gh api "repos/$RUN" | jq -r --arg repo "$BOT_REPOSITORY" '[.referenced_workflows[]? | select(.path | startswith($repo + "/.github/workflows/deploy-bump.yml@"))][0] | "\(.path | split("/.github/")[0]) \(.sha)"')"
          read -r repository sha <<< "$entry"
          if [[ ! "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not tell which commit of the deploy-bump workflow this run uses: $entry"
            exit 1
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha }}
          path: .lktec-bot
          persist-credentials: false
      - uses: ./.lktec-bot/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-bump-handover
          path: ${{ runner.temp }}/handover
      - id: commit
        name: Commit the rewritten manifests
        env:
          LKTEC_BOT_APP_ID: ${{ secrets.app-id }}
          LKTEC_BOT_PRIVATE_KEY: ${{ secrets.private-key }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ needs.bump.outputs.base }}
          HANDOVER: ${{ runner.temp }}/handover
        run: |
          lktec-bot sync commit \
            --repository "$REPOSITORY" \
            --changed-dir "$HANDOVER" \
            --version "$VERSION" \
            --branch "$BRANCH" \
            --base-sha "$BASE"
