name: Dependabot lock files

# lktec-bot uses its own lockfiles workflow (docs/modules/lockfiles.md). The pin below is a
# commit of main; move it by hand when a change to the reusable workflow or to the modules
# should take effect here (the bot is installed from the pinned commit).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read # the reusable workflow reads which commit of itself the run uses

jobs:
  lockfiles:
    uses: lukislp/lktec-bot/.github/workflows/lockfiles.yml@ba077f4fb46a8c9dbcd7d0453e5398440c831a80 # v0.7.3
    with:
      uv-version: "0.12.24" # the pin of ci.yml
      python-version: "3.13"
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}