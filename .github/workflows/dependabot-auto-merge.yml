name: Dependabot auto-merge

# lktec-bot uses its own automerge workflow (docs/modules/automerge.md). The pin below is a
# commit of main; move it by hand when a change to the reusable workflow or to the modules
# should take effect here (the bot is installed from the pinned commit).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, auto_merge_enabled]
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the reusable workflow reads which commit of itself the run uses

jobs:
  automerge:
    uses: lukislp/lktec-bot/.github/workflows/automerge.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}
