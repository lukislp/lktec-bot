name: Release

# This repository's own release through its release module (docs/modules/release.md,
# "Dogfooding"): every push to main that carries a feat or fix commit becomes a tag vX.Y.Z and a
# GitHub release, which is what callers pin. The triggers stay here because a reusable workflow
# cannot declare them for the caller; release.yml next to this file is the reusable workflow.
#
# The pin below is a commit of main; move it by hand when a change to the reusable workflow or
# to the module should take effect here (the bot is installed from the pinned commit).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the reusable workflow reads which commit of itself the run uses

jobs:
  release:
    uses: lukislp/lktec-bot/.github/workflows/release.yml@ba077f4fb46a8c9dbcd7d0453e5398440c831a80 # v0.7.3
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  # Builds the sdist and the wheel at the released tag and attaches them, their Sigstore bundles
  # and the build provenance to the GitHub release the job above created. The tag is created by
  # the lktec-bot App through the API (no signature on the tag); these assets are what to verify
  # (docs/releases.md). Runs only when a release was made.
  publish-assets:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # upload to the release
      id-token: write # keyless signing and provenance
      attestations: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UV_PYTHON_DOWNLOADS: never
      UV_VERSION: "0.12.24"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            api.github.com:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0 # hatch-vcs reads the version from the tag
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          download-from-astral-mirror: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The build backend comes from uv.lock (the `build` group), not from an unpinned resolve.
      - name: Build the sdist and the wheel
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv sync --locked --group build
          uv build --no-build-isolation --out-dir dist
          ls -l dist
      - name: Upload the distributions to the GitHub release
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.whl --clobber
      # Keyless Sigstore signature bundle per file, uploaded next to it, so a download can be
      # verified offline (see docs/releases.md and SECURITY.md).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the release assets and attach the signature bundles
        run: |
          for f in dist/*.tar.gz dist/*.whl; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/lukislp/lktec-bot/\.github/workflows/self-release\.yml@refs/heads/main$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
            gh release upload "$TAG" "$f.sigstore.json" --clobber
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl
      - name: Attach the build provenance to the release
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" provenance.intoto.jsonl
          gh release upload "$TAG" provenance.intoto.jsonl --clobber
