name: Dependabot auto-merge

# Thin caller of the automerge workflow of lktec-bot. The triggers stay here because a reusable
# workflow cannot declare them for the caller. Put this file at
# .github/workflows/dependabot-auto-merge.yml and read docs/modules/automerge.md of lktec-bot
# for the bootstrap (install the App, two secrets, the policy file) before it first runs.
#
# Replace <sha> with the commit of a release tag of lukislp/lktec-bot (or of your fork, then also set the
# bot-repository input) and vX.Y.Z with that tag. Like every other reference it stays pinned by SHA.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, auto_merge_enabled]
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the reusable workflow reads which commit of itself the run uses

jobs:
  automerge:
    uses: lukislp/lktec-bot/.github/workflows/automerge.yml@<sha> # vX.Y.Z
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}
