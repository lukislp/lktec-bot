# .github/lktec-bot.yml of a repository that uses the automerge workflow. Committed to the
# default branch: the bot reads it from there, never from a pull request.
version: 1
modules:
  automerge:
    enabled: true
    # patch, minor and digest updates are armed; manual leaves majors to a person.
    majors: manual # manual | auto
    # auto arms a pull request that changes .github/workflows/; manual leaves it to a person.
    workflow-files: auto # auto | manual
    # How GitHub merges once the checks are green.
    method: squash # squash | merge | rebase
    # true: a pull request GitHub refuses to arm because it is already mergeable (all checks done)
    # is merged by the bot, bound to the head it approved and to branch protection. false: it is
    # approved and left for a person.
    merge-ready: false # true | false
    # Dependency names (exact, case-insensitive) that are never approved or armed. A grouped
    # pull request is skipped as a whole when any member is listed.
    exclude: []

  # Commits the lock files that the lockfiles workflow regenerated for a Dependabot pull request
  # (see docs/modules/lockfiles.md). Omit this block when the repository does not use it.
  lockfiles:
    enabled: true
    # Default (empty): every supported ecosystem. Supported: uv (uv.lock), dotnet
    # (packages.lock.json).
    ecosystems: []
    # Default (empty): the whole repository. A file or a directory below the repository root.
    paths: []
    # One line; {number} is the pull request number.
    commit-message: "chore(deps): refresh lockfiles after Dependabot bump"

  # Commits generated files onto a branch through the App, e.g. the image tag bump after a
  # release (see docs/modules/sync.md). Needs the App as a bypass actor of the branch ruleset.
  # Set enabled: true once the deploy-bump or sync workflow is in place.
  sync:
    enabled: false
    # Required. Only files under these directories (or exactly these files) can be committed.
    # Never .github/workflows/.
    paths: [k8s, deploy]
    # The branch the commit goes onto.
    branch: main
    # One line; {version} is the release version handed to the workflow.
    commit-message: "chore(deploy): image {version} [skip ci]"
    # Report the run as a check run on the release commit (the workflow's base-sha). Needs the
    # App's checks: write. Off by default; check-name is optional (one line, up to 100 characters).
    check: false
    # check-name: "lktec-bot / deploy bump"

  # Tags and publishes a release from the Conventional Commits on the default branch (see
  # docs/modules/release.md). Set enabled: true once the release workflow is in place.
  release:
    enabled: false
    # tag: a push is released as a tag plus a GitHub release. (pr, a release pull request, is
    # planned and rejected for now.)
    mode: tag
    # The tag name; {version} exactly once.
    tag-format: "v{version}"
    # The branch releases are cut from.
    branch: main
    # The version when no tag matches tag-format yet.
    first-version: "1.0.0"
    # Evaluated in order before the defaults (breaking: major, feat: minor, fix, perf and revert: patch,
    # anything else: nothing); the first rule that matches a commit decides. type, scope and
    # breaking are conditions, release is major | minor | patch | none. Example, the rules many
    # repositories carry in .releaserc.json:
    #   - {breaking: true, release: minor}
    #   - {type: refactor, release: patch}
    #   - {type: fix, scope: ci, release: none}
    rules: []
    # Commit type to heading in the release notes; merged over feat: Features, fix: Bug Fixes,
    # perf: Performance Improvements, revert: Reverts. Types without a heading that release
    # through a rule appear under "Other changes".
    sections: {}